name: Deploy Encoded Radiance Studio Public Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy public directory
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify public website entry file
        run: |
          test -f public/index.html
          echo "Verified public/index.html"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy GitHub Pages website
        id: deployment
        uses: actions/deploy-pages@v4
